<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f7c6c8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="软糖默契测试" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="description" content="十道轻松小题目，测测你们的情侣默契有几分甜。结果可保存成卡片分享。" />
  <link rel="icon" type="image/png" href="assets/icon.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <title>软糖情侣默契测试</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <div id="rotate" aria-hidden="true">请把手机竖过来再测哦</div>
    <div id="stage">
      <div id="bg" aria-hidden="true"></div>

      <section id="screen-start" class="screen active">
        <div class="hero">
          <img id="hero-sticker" src="assets/stickers/s01.png" alt="软糖双人打招呼" />
          <p class="kicker">软糖双人 · 小测试</p>
          <h1 class="logo">软糖情侣默契测试</h1>
          <p class="tagline">十道轻松小题目，测测你们的默契有几分甜</p>
        </div>
        <button type="button" id="btn-start" class="btn primary">开始测试</button>
      </section>

      <section id="screen-quiz" class="screen" hidden>
        <div class="progress-wrap">
          <div class="progress-meta">
            <span id="progress-label">1 / 10</span>
          </div>
          <div class="progress-track" aria-hidden="true">
            <div id="progress-bar" class="progress-bar"></div>
          </div>
          <div id="progress-dots" class="progress-dots" aria-hidden="true"></div>
        </div>
        <img id="quiz-sticker" alt="" />
        <h2 id="quiz-question"></h2>
        <div id="quiz-options" class="options"></div>
      </section>

      <section id="screen-compute" class="screen" hidden>
        <div class="compute-wrap">
          <img id="compute-sticker" src="assets/stickers/s23.png" alt="" />
          <p class="compute-kicker">正在计算默契</p>
          <p class="compute-title">两颗软糖碰一碰……</p>
        </div>
      </section>

      <section id="screen-result" class="screen" hidden>
        <canvas id="card" width="1080" height="1440" aria-label="默契测试结果卡片"></canvas>
        <div class="btn-stack">
          <div class="btn-row">
            <button type="button" id="btn-save" class="btn primary">保存图片</button>
            <button type="button" id="btn-share" class="btn soft">复制分享文案</button>
          </div>
          <button type="button" id="btn-again" class="btn ghost">再测一次</button>
        </div>
      </section>

      <footer class="footer">
        <span>作者 hukx</span>
        <span class="sep">·</span>
        <a href="https://afdian.com/a/hukxai" target="_blank" rel="noopener noreferrer">请作者喝奶茶</a>
      </footer>

      <div id="save-overlay" hidden>
        <div class="save-panel">
          <p class="save-hint">长按图片保存到相册</p>
          <img id="save-img" alt="默契测试结果卡片" />
          <button type="button" id="btn-close-save" class="btn ghost">关闭</button>
        </div>
      </div>

      <div id="copy-overlay" hidden>
        <div class="copy-panel">
          <p class="copy-hint">复制没成功，请手动复制下面的文案</p>
          <textarea id="copy-text" readonly rows="6"></textarea>
          <button type="button" id="btn-close-copy" class="btn primary">关闭</button>
        </div>
      </div>

      <div id="toast" hidden></div>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
